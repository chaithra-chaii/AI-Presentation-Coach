<!DOCTYPE html>
<html>

<head>

    <title>AI Presentation Coach</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>AI Presentation Coach</h1>

        <p>
            Speak your presentation and your speech
            will be converted into text.
        </p>

        <button id="startBtn">
            🎤 Start Speaking
        </button>

        <button id="stopBtn">
            ⏹ Stop
        </button>

        <p id="status">
            Ready to start
        </p>

        <textarea
            id="output"
            placeholder="Your speech will appear here..."
            readonly>
        </textarea>

    </div>

    <script src="script.js"></script>

</body>

</html>
